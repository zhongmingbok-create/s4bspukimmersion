<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BSP UK Immersion 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Cabin:wght@400;500;600;700&display=swap">
<style>
/* Layout: a London street-poster home of bright tiles, each opening one section on its own. Deliberately a single bright look in every theme. */
:root{
  color-scheme:light;
  --royal:#012169; --royal2:#0a2f86; --royal3:#1b47a6; --red:#c8102e; --tube:#dc241f; --yellow:#ffd329; --sky:#35b8ee;
  --purple:#6950a1; --green:#00782a; --pink:#f7b3c8; --black:#14141a; --white:#fff; --paper:#f2f5fb; --ink:#0c1a44; --muted:#4c5878; --rule:#d5dbe9;
  --orange:#e8710a; --teal:#007d8a; --gold:#f5b700;
  --display:"Abril Fatface","Songti SC","Noto Serif SC",Georgia,serif;
  --body:"Cabin","Gill Sans","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--royal);color:var(--ink);font:400 16px/1.55 var(--body)}
body.inner{background:var(--paper)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--royal)}
.wrap{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.005em}
a{color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
mark{background:var(--yellow);color:var(--ink);padding:0 .18em;border-radius:2px}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}

/* ===== HOME ===== */
.hero{position:relative;overflow:hidden;background:var(--royal);color:var(--white)}
.jack{position:absolute;inset:0;opacity:.09;pointer-events:none;background:
  linear-gradient(90deg,transparent 46%,#fff 46%,#fff 54%,transparent 54%),
  linear-gradient(0deg,transparent 42%,#fff 42%,#fff 58%,transparent 58%),
  linear-gradient(26deg,transparent 48%,#fff 48%,#fff 52%,transparent 52%),
  linear-gradient(-26deg,transparent 48%,#fff 48%,#fff 52%,transparent 52%)}
.hero-text{position:relative;padding-block:34px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start}
.hero h1{font-size:clamp(2.7rem,8.5vw,5.6rem);line-height:1.02;margin-top:8px}
.hero h1 span{color:var(--yellow)}
.hero .sub{margin:12px 0 0;font-size:clamp(1rem,2.4vw,1.25rem);font-weight:500}
.flag{width:clamp(74px,12vw,132px);height:auto;transform-origin:left center;animation:wave 2.6s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
@keyframes wave{0%,100%{transform:perspective(420px) rotateY(0) skewY(0)}50%{transform:perspective(420px) rotateY(-16deg) skewY(2.5deg)}}
.strip{position:relative;display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-bottom:6px}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;padding:5px 13px;border-radius:99px;background:rgba(255,255,255,.14);text-decoration:none;font-variant-numeric:tabular-nums}
.badge.hot{background:var(--yellow);color:var(--ink)}
a.badge.hot:hover{background:var(--white)}
.scenebox{--h:clamp(150px,27vw,320px);position:relative;height:var(--h);overflow:hidden;margin-top:-4px}
.stage{position:absolute;bottom:0;left:50%;width:max(100%,calc(var(--h)*3.53));aspect-ratio:1200/340;transform:translateX(-50%)}
.lay{position:absolute;inset:0;width:100%;height:100%;display:block}
.sprite{position:absolute;display:block;will-change:transform}
.cl1,.cl2{width:10%;left:0;animation:drift 46s linear infinite}
.cl1{top:4%}.cl2{top:22%;width:7.5%;opacity:.7;animation-duration:70s;animation-delay:-30s}
.cl svg,svg.cl{display:block;width:100%}
@keyframes drift{from{transform:translateX(-120%)}to{transform:translateX(1100%)}}
.eye{left:60.83%;top:5.88%;width:21.67%;animation:spin 60s linear infinite}
.hub{left:70.42%;top:39.7%;width:2.5%}
@keyframes spin{to{transform:rotate(360deg)}}
.bus{left:0;bottom:7.6%;width:15.83%;animation:busgo 17s linear infinite}
@keyframes busgo{from{transform:translateX(-110%)}to{transform:translateX(650%)}}
.cab{left:0;bottom:8.8%;width:10.67%;animation:cabgo 12s linear infinite;animation-delay:-5s}
@keyframes cabgo{from{transform:translateX(960%)}to{transform:translateX(-120%)}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .9s linear infinite}
.dashes{position:absolute;left:0;bottom:7%;height:4px;width:calc(100% + 60px);background:repeating-linear-gradient(90deg,#ffd329 0 34px,transparent 34px 60px);animation:dash 1.1s linear infinite;will-change:transform}
@keyframes dash{to{transform:translateX(-60px)}}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding-block:22px 44px}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:178px;padding:16px;text-decoration:none;border-radius:6px;transition:transform .22s cubic-bezier(.2,1.5,.4,1),box-shadow .22s;animation:pop .55s cubic-bezier(.2,1.4,.4,1) backwards;animation-delay:calc(var(--i)*65ms)}
@keyframes pop{from{transform:translateY(22px) scale(.97)}}
@media (hover:hover){.tile:hover{transform:translateY(-5px) rotate(-.5deg);box-shadow:0 14px 26px rgba(0,0,0,.4)}}
.tile:active,.dtile:active{transform:scale(.97)}
.noanim .tile,.noanim .stag>*,.noanim .enter{animation:none}
.tile.w2{grid-column:span 2}
.tile.w2 svg{height:104px}
.tile.t-white svg{height:88px;max-width:100%}
.tile h2{font-size:clamp(1.3rem,2.5vw,1.8rem);line-height:1.12;position:relative}
.tile p{margin:3px 0 0;font-size:.93rem;line-height:1.35;font-weight:500;position:relative}
.tile svg{height:74px;width:auto;align-self:flex-end;overflow:visible}
.t-white{background:var(--white);color:var(--royal)}
.t-yellow{background:var(--yellow);color:var(--ink)}
.t-red{background:var(--red);color:var(--white)}
.t-sky{background:var(--sky);color:var(--ink)}
.t-purple{background:var(--purple);color:var(--white)}
.t-green{background:var(--green);color:var(--white)}
.t-pink{background:var(--pink);color:var(--ink)}
.t-black{background:var(--black);color:var(--white)}
.minitrain{animation:mt 5s ease-in-out infinite alternate}
@keyframes mt{from{transform:translateX(0)}to{transform:translateX(112px)}}
.march{animation:march .7s ease-in-out infinite alternate}
.march.m2{animation-delay:.2s}.march.m3{animation-delay:.4s}
@keyframes march{to{transform:translateY(-5px)}}
.plane{animation:fly 3.6s ease-in-out infinite alternate}
@keyframes fly{from{transform:translate(-8px,6px) rotate(-3deg)}to{transform:translate(10px,-6px) rotate(3deg)}}
.drop{animation:rain 1.1s linear infinite}
.drop.d2{animation-delay:.35s}.drop.d3{animation-delay:.7s}
@keyframes rain{from{transform:translateY(-10px);opacity:0}30%{opacity:1}to{transform:translateY(16px);opacity:0}}
.coin{transform-box:fill-box;transform-origin:center;animation:coin 3s ease-in-out infinite}
@keyframes coin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.15)}}
.hand{transform-box:view-box;transform-origin:40px 40px;animation:spin 8s linear infinite}
.hand.h2{animation-duration:48s}
.ring{animation:ring 2.6s ease-in-out infinite;transform-origin:50% 12%;transform-box:fill-box}
@keyframes ring{0%,70%,100%{transform:rotate(0)}74%{transform:rotate(-9deg)}80%{transform:rotate(9deg)}86%{transform:rotate(-6deg)}92%{transform:rotate(5deg)}}
.leaf{animation:leaf 2.4s ease-in-out infinite alternate;transform-origin:50% 100%;transform-box:fill-box}
@keyframes leaf{to{transform:rotate(-8deg)}}

/* ===== INNER VIEWS ===== */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--royal);color:var(--white)}
.topbar .wrap{display:flex;align-items:center;gap:10px;padding-block:9px;min-width:0}
.home-btn{display:inline-flex;align-items:center;gap:7px;font-weight:700;background:var(--yellow);color:var(--ink);text-decoration:none;padding:6px 14px;border-radius:99px;white-space:nowrap;transition:transform .15s}
.home-btn:hover{transform:translateX(-3px)}
.topbar .where{font-family:var(--display);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.vband{color:var(--fg,#fff);background:var(--bg,var(--red));padding-block:26px 24px;overflow:hidden}
.vband .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px}
.vband h1{font-size:clamp(2rem,6vw,3.5rem);line-height:1.08}
.vband p{margin:6px 0 0;font-weight:500;max-width:60ch}
.vband svg{height:clamp(64px,11vw,104px);width:auto;flex:none;overflow:visible}
.vbody{padding-block:26px 56px;display:grid;gap:26px}
.enter{animation:rise .42s cubic-bezier(.2,1,.4,1) backwards}
@keyframes rise{from{transform:translateY(16px)}}
.stag>*{animation:pop .5s cubic-bezier(.2,1.3,.4,1) backwards}
.stag>*:nth-child(2){animation-delay:70ms}.stag>*:nth-child(3){animation-delay:140ms}.stag>*:nth-child(4){animation-delay:210ms}.stag>*:nth-child(5){animation-delay:280ms}.stag>*:nth-child(6){animation-delay:350ms}

/* groups */
.gp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.gcard{border-radius:6px;overflow:hidden;background:var(--white);display:flex;flex-direction:column;min-width:0}
.gcard header{background:var(--c);color:var(--cf,#fff);padding:16px}
.gcard h2{font-size:1.5rem;line-height:1.15}
.gcard ul{list-style:none;margin:0;padding:12px 16px;display:grid;gap:2px;flex:1}
.gcard li{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.05rem;padding:5px 0;border-bottom:1px solid var(--rule)}
.gcard li:last-child{border:0}
.gcard li svg{width:18px;height:28px;flex:none}
.gfoot{padding:0 16px 16px;display:grid;gap:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-weight:700;font-size:.88rem;padding:3px 11px;border-radius:99px;background:var(--c,var(--royal));color:var(--cf,#fff);text-decoration:none;transition:transform .15s;font-variant-numeric:tabular-nums}
.chip:hover{transform:scale(1.08)}

/* days overview */
.how{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.how div{background:var(--white);border-left:8px solid var(--yellow);padding:12px 16px;border-radius:0 6px 6px 0;min-width:0}
.how b{font-family:var(--display);font-weight:400;font-size:1.15rem;display:block}
.legblock{display:grid;gap:10px}
.leghead{display:flex;align-items:center;gap:10px}
.leghead i{width:30px;height:9px;background:var(--leg);display:block;flex:none}
.leghead h2{font-size:1.4rem}
.leghead small{color:var(--muted);font-size:.9rem}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.dtile{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;align-items:center;background:var(--leg);color:#fff;padding:12px;border-radius:6px;text-decoration:none;transition:transform .2s cubic-bezier(.2,1.5,.4,1),box-shadow .2s;min-width:0}
@media (hover:hover){.dtile:hover{transform:translateY(-4px);box-shadow:0 10px 18px rgba(1,33,105,.3)}}
.dtile.now{outline:4px solid var(--yellow);outline-offset:2px}
.round{width:54px;height:54px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:1.3rem;border:6px solid var(--ink);font-variant-numeric:tabular-nums}
.dtile b{display:block;font-size:.98rem}
.dtile span.hl{display:block;font-size:.88rem;line-height:1.28;margin-top:1px}
.dtile em{display:block;font-style:normal;font-size:.76rem;font-weight:700;letter-spacing:.04em;margin-top:4px;opacity:.92}

/* route */
.tubeline{background:var(--white);padding:30px 0 10px;border-bottom:1px solid var(--rule)}
.tl{position:relative;list-style:none;display:grid;grid-template-columns:repeat(14,minmax(0,1fr));padding:0;margin:0}
.tl li{position:relative;min-width:0}
.tl li::before{content:"";position:absolute;left:0;right:0;top:12px;height:6px;background:var(--leg)}
.tl li:first-child::before{left:50%}.tl li:last-child::before{right:50%}
.tl a{position:relative;display:grid;justify-items:center;gap:2px;text-decoration:none;font-weight:700;font-size:.72rem}
.tl .st{width:30px;height:30px;border-radius:50%;background:#fff;border:4px solid var(--leg);display:grid;place-items:center;font-size:.82rem;font-variant-numeric:tabular-nums;transition:transform .2s,background .2s,color .2s}
.tl a:hover .st{transform:scale(1.15)}
.tl .cur .st{background:var(--leg);color:#fff;transform:scale(1.18)}
.train{position:absolute;top:-23px;left:0;width:52px;margin-left:-26px;transition:left .9s cubic-bezier(.5,0,.2,1);pointer-events:none}
.train svg{display:block;width:100%}

/* a single day */
.daytop{background:var(--leg);color:#fff;padding-block:22px}
.daytop .wrap{display:flex;align-items:center;gap:18px;min-width:0}
.big-round{position:relative;width:96px;height:96px;flex:none;border-radius:50%;border:15px solid #fff;display:grid;place-items:center}
.big-round b{position:absolute;left:-22px;right:-22px;top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;text-align:center;font-size:.98rem;padding:2px 0;letter-spacing:.02em;white-space:nowrap}
.daytop h1{font-size:clamp(1.8rem,5.5vw,3rem);line-height:1.08}
.daytop p{margin:4px 0 0;font-weight:600;font-size:1.05rem}
.daypanes{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:16px;align-items:start}
.daytabs{display:none}
.stop-b{min-width:0}
.about{margin-top:6px}
.about summary{display:inline-flex;align-items:center;gap:7px;cursor:pointer;list-style:none;font-size:.86rem;font-weight:700;color:var(--ink);background:var(--yellow);padding:4px 11px;border-radius:99px;min-height:30px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.about summary::-webkit-details-marker{display:none}
.about summary::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .2s}
.about[open] summary{background:var(--ink);color:#fff}
.about[open] summary::after{transform:translateY(1px) rotate(225deg)}
.about-b{margin-top:8px;padding:12px 14px;background:var(--paper);border-radius:6px;display:grid;gap:8px;font-size:.95rem;line-height:1.45;animation:rise .25s ease}
.about-b .kick{font-size:.82rem;color:var(--leg);font-weight:700}
.about-b p{margin:0}
.about-b h4{margin:2px 0 0;font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--red)}
.about-b ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.about-b li{position:relative;padding-left:18px}
.about-b li::before{content:"";position:absolute;left:0;top:.42em;width:10px;height:10px;border-radius:50%;background:#fff;border:3px solid var(--leg)}
.about+.about{margin-top:6px}
.lv{background:var(--white);border:2px solid var(--yellow);border-radius:6px;padding:10px 12px;display:grid;gap:6px}
.lv h4{margin:0;color:var(--ink)}
.pane{border-radius:6px;padding:18px;min-width:0;display:grid;gap:13px}
.plan{background:var(--white)}
.pane h2{font-size:1.45rem}
.tt{list-style:none;margin:0;padding:0;display:grid;position:relative}
.tt>li{display:grid;grid-template-columns:5.6rem 20px minmax(0,1fr);gap:8px;position:relative;padding-bottom:13px}
.tt>li::before{content:"";position:absolute;left:calc(5.6rem + 8px + 8px);top:6px;bottom:-6px;width:4px;background:var(--leg)}
.tt>li:last-child::before{display:none}
.tt time{font-size:.86rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.5;text-align:right}
.tt .dot{width:14px;height:14px;margin:4px 0 0 3px;border-radius:50%;background:#fff;border:3px solid var(--leg);position:relative;z-index:1}
.tt em{display:block;font-style:normal;font-size:.88rem;color:var(--muted);line-height:1.35;margin-top:1px}
.tt b{font-weight:700}
.meta{font-size:.92rem;border-top:2px solid var(--rule);padding-top:10px;display:grid;gap:3px}
.reflect{background:var(--royal);color:#fff;border-top:10px solid var(--yellow)}
.reflect .eyebrow{color:var(--yellow)}
.focus{font-family:var(--display);font-size:clamp(1.3rem,3vw,1.7rem);line-height:1.28;margin:0}
.prompts{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.prompts li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;animation:slide .45s ease backwards;animation-delay:calc(var(--i)*90ms + 150ms)}
@keyframes slide{from{transform:translateX(16px)}}
.prompts li>span:first-child{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--yellow);color:var(--ink);font-weight:700;font-size:.82rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:99px;border:2px solid var(--yellow);color:var(--yellow);text-decoration:none}
.tag:hover{background:var(--yellow);color:var(--ink)}
.grpline{background:var(--red);margin:0 -18px -18px;padding:12px 18px;border-radius:0 0 6px 6px;font-size:.95rem}
.steps{font-size:.93rem;border-top:1px solid rgba(255,255,255,.28);padding-top:10px}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pager a{background:var(--ink);color:#fff;font-weight:700;padding:9px 16px;border-radius:99px;text-decoration:none;transition:transform .15s}
.pager a:hover{transform:scale(1.05)}
.pager .all{background:var(--yellow);color:var(--ink)}
.pager .none{visibility:hidden}

/* blocks */
.k{display:grid;gap:12px}
.kcard{background:var(--c);color:#fff;padding:18px;border-radius:6px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;align-items:start;scroll-margin-top:60px}
.kcard .num{font-family:var(--display);font-size:3.2rem;line-height:1}
.kcard p{margin:0;font-size:1.08rem;font-weight:500}
.kcard .chips{margin-top:9px}
.kcard .chip{background:rgba(255,255,255,.2);color:#fff}
.kcard.flash{animation:flash 1.3s ease}
@keyframes flash{0%,50%{box-shadow:0 0 0 5px var(--yellow)}100%{box-shadow:0 0 0 0 transparent}}
.tasks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.task{background:var(--white);padding:16px;border-radius:6px;border-top:8px solid var(--c);min-width:0}
.task h3{font-size:1.25rem;margin-bottom:5px}
.task ul{margin:0;padding-left:1.1rem;display:grid;gap:5px}
.card{background:var(--white);border-radius:6px;padding:18px;display:grid;gap:10px;align-content:start;min-width:0;border-top:8px solid var(--c,var(--red))}
.card h2{font-size:1.45rem}
.card ul{margin:0;padding-left:1.1rem;display:grid;gap:6px}
.card p{margin:0}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:470px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.note{font-size:.9rem;color:var(--muted);margin:0}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.rooms div{background:var(--paper);padding:10px 12px;border-radius:4px;font-weight:500}
.rooms b{display:block;font-family:var(--display);font-weight:400;font-size:1.08rem;color:var(--red)}
.words{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.word{font-family:var(--display);font-size:clamp(1.25rem,4vw,2.2rem);text-align:center;padding:18px 6px;border-radius:6px;color:#fff;background:var(--c)}
.booths{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.booth{background:var(--c,var(--red));color:var(--cf,#fff);padding:16px;border-radius:6px;min-width:0;overflow-wrap:anywhere}
.booth h2{font-size:1.28rem;margin-bottom:7px}
.booth p{margin:0;line-height:1.5}
.packs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

const PLACES={
1:[{n:"People's History Museum",k:"The national museum of democracy",i:"Set partly in an old hydraulic pumping station by the River Irwell, this museum tells how ordinary Britons fought for the vote and for workers' rights, from 1819 to today.",l:["<b>Peterloo, 1819:</b> troops charged a peaceful crowd in Manchester, killing about 18 people and injuring about 700.","<b>Thomas Paine's desk:</b> he wrote part of <i>Rights of Man</i> at it.","<b>The banners:</b> part of a collection of over 400, and you can watch conservators at work through a window.","<b>A smuggler's coffin</b> once used to move banned newspapers."]},
{n:"Salford Quays and MediaCityUK",k:"Urban Regeneration Walking Tour",i:"Queen Victoria opened the Manchester Ship Canal in 1894, turning an inland city into a port. The docks closed in 1982 with about 3,000 jobs lost. The same waterfront now holds the BBC, theatres and homes.",l:["<b>The Plaza:</b> an open-air filming spot for <i>BBC Breakfast</i>.","<b>Detroit Bridge:</b> a railway bridge from the dock days, moved here in 1988.","<b>The Lowry:</b> an arts centre named after the Salford-born painter of these docks.","<b>The old docks themselves:</b> Docks 6 to 9 were kept and redeveloped. Docks 1 to 5 were filled in."]}],
2:[{n:"Black Country Living Museum",k:"Open-air history, 26 acres",i:"Shops, homes and workshops have been rebuilt here so you can walk through more than 200 years of life in one of Britain's first industrial landscapes. Costumed staff bring the streets to life.",l:["<b>Boat tour, 1100h:</b> canals were how heavy goods moved. This canal also appears in <i>Peaky Blinders</i>.","<b>Fish and chips, 1230h:</b> from the museum's traditional high street shop.","<b>Mine gas show and colliery tour, 1400h:</b> go underground to see an 1850s miner's life. Boys as young as eight sat in the dark for hours opening gates.","<b>1920s cinema:</b> a period picture house that shows a short silent-era film."]}],
3:[{n:"Imperial War Museum North",k:"A building that makes you feel unsettled",i:"Daniel Libeskind's first UK building, completed in 2002 on a wartime bomb site. It represents a globe shattered into three pieces, for conflict on land, in the air and on water.",l:["<b>The teapot story:</b> Libeskind dropped a bagged teapot from his studio window and modelled the building on the pieces.","<b>The floor:</b> the main space slopes by about eight feet, with few right angles and no natural light. Notice how that feels.","<b>The AirShard:</b> the concrete tower looks as if it leans, but it stands straight.","<b>Documentary Challenge, 1100h:</b> you will work with primary sources, so ask who made each one and why."]},
{n:"Old Trafford",k:"The Theatre of Dreams",i:"Manchester United's home since 1910 seats nearly 75,000. Bombing in World War II almost destroyed it. Sir Bobby Charlton gave it its famous nickname.",l:["<b>Behind the scenes:</b> the changing room, the players' tunnel and the press room.","<b>The Munich Tunnel:</b> remembers the 1958 air disaster that killed members of the team.","<b>The trophies:</b> at the start of the club museum.","<b>All Red All Equal:</b> your Skills Lab workshop on equality, diversity and inclusion."]}],
4:[{n:"Range Rover Factory, Solihull",k:"The birthplace of Land Rover and Range Rover",i:"Land Rover built its first 4x4 at Solihull in 1948. The first Range Rover prototype followed in 1967 under the codename Velar, and production began in 1970. Your 3-hour tour runs from the early stages of production to final assembly.",l:["<b>People and robots:</b> which jobs are automated, and which are still done by skilled hands?","<b>Quality checks:</b> count how many times a car is inspected along the line.","<b>Velar:</b> the aim was never luxury, but a more comfortable Land Rover. See how far the brand has moved.","<b>Supply chains:</b> ask where the parts come from."]}],
5:[{n:"Bletchley Park",k:"Home of the wartime codebreakers",i:"This country estate was Britain's top-secret codebreaking centre in World War II. Its work helped shorten the war and laid the foundations of modern computing. Your session is 'Interception to Intelligence: D-Day'.",l:["<b>Enigma and the Bombe:</b> see Enigma machines and the working replica of the Bombe, the machine Turing and Welchman developed.","<b>Hut 8:</b> Turing's office, and how German messages were decrypted.","<b>Hut 11:</b> Bombe operators, many of them Wrens, worked round the clock. They called the room the \"Hell Hole\".","<b>The Mansion:</b> its ballroom was a film set for <i>The Imitation Game</i>.","<b>Today's date:</b> 11 November is Armistice Day in Britain, so watch for the two-minute silence at 11am."]}],
6:[{n:"Oxford city walk",k:"With your Blue Badge Guide",i:"Oxford is a working university spread across a city, with its colleges built around quiet courtyards. Your guide will explain the collegiate system and the customs that come with it.",l:["<b>Radcliffe Camera:</b> the round, domed library at the centre of the city.","<b>Bodleian Library and Sheldonian Theatre:</b> at the heart of university life.","<b>Bridge of Sighs:</b> the covered bridge linking two parts of Hertford College.","<b>Screen and story:</b> ask where <i>Harry Potter</i> and <i>Inspector Morse</i> were filmed, and where Tolkien and Lewis walked."]},
{n:"Ashmolean Museum",k:"Britain's first public museum",i:"It opened on 24 May 1683 to house the collection Elias Ashmole gave to the University. Today its China galleries trace over 3,000 years of Chinese civilisation.",l:["<b>Ceramics:</b> Tang and Song wares, including a celadon collection said to be unrivalled outside China.","<b>Two wooden bodhisattvas</b> from Shanxi, dating from the 10th to 13th centuries.","<b>Modern Chinese painting:</b> masters such as Qi Baishi. Do you recognise any of the styles?","<b>The Oxford plate:</b> Chinese export porcelain showing an Oxford view. East meets West on one plate.","<b>On your way in:</b> Ju Ming's <i>Taichi Arch</i> on the forecourt. Also inside the museum: Guy Fawkes' lantern."]}],
7:[{n:"Magdalen College",k:"Say it \"MAWD-lin\"",i:"Founded in 1458 by William of Waynflete, Magdalen is known for its medieval buildings and its large grounds. Your alumni guides can show you what college life is really like.",l:["<b>Great Tower:</b> 144 feet tall. The choir sings from the top at 6am every May Morning.","<b>The Cloister:</b> built 1474 to 1480, with carved grotesques added in 1508.","<b>The Grove and Addison's Walk:</b> a deer park, and a riverside path that C.S. Lewis wrote a poem about.","<b>Famous names:</b> C.S. Lewis taught here from 1925 to 1954, and Oscar Wilde studied here."]},
{n:"Browns Oxford",k:"Traditional afternoon tea with alumni",i:"This brasserie on Woodstock Road was once a Morris garage, a reminder of Oxford's car-making past. Afternoon tea is the setting, and the conversation with your seniors is the point.",l:["<b>The tea:</b> sandwiches, warm scones with jam and clotted cream, and small cakes.","<b>Ask your seniors:</b> what surprised them most, what they wish they had known, and what they miss about Singapore.","<b>Tip:</b> prepare your questions before you sit down."]}],
8:[{n:"Westminster Abbey",k:"Where Britain crowns and remembers",i:"Monks first settled here around 960, and Edward the Confessor's stone abbey was finished in 1065. Monarchs have been crowned here for almost a thousand years, most recently King Charles III in 2023.",l:["<b>Coronation Chair:</b> look for initials carved by visitors and schoolboys over 200 years ago.","<b>Poets' Corner:</b> find the writers you have read in class.","<b>Tomb of the Unknown Warrior:</b> a soldier \"unknown by name or rank\", buried on 11 November 1920.","<b>Scientists' Corner:</b> Newton and Darwin.","<b>Henry VII Lady Chapel:</b> begun in 1503. Look up at the ceiling."]},
{n:"London City Tour",k:"With your Blue Badge Guide",i:"A first look at the capital, with the landmarks that shape how Britain presents itself to the world. Ask your guide about British life, customs and culture as you go.",l:["<b>Big Ben</b> and the Elizabeth Tower.","<b>Buckingham Palace</b> and <b>St James's Park.</b>","<b>Small things:</b> street signs, red buses and how people queue."]},
{n:"UK Parliament",k:"Palace of Westminster",i:"This is a working Parliament, and many of its traditions shaped Singapore's own system. The tour covers four spaces and takes about 90 minutes, and the route can change at short notice.",l:["<b>Westminster Hall:</b> the oldest part of the palace, begun in 1097.","<b>Central Lobby:</b> where citizens can come to meet their MP.","<b>Commons Chamber:</b> green benches. Rebuilt after bombing in World War II. Compare it with Singapore's Parliament.","<b>Lords Chamber:</b> red benches and the throne.","<b>Good to know:</b> Big Ben itself is not part of this tour."]}],
9:[{n:"London Underground",k:"Your transport today",i:"Opened in 1863, the Tube is the world's first underground railway. Its stations also served as air raid shelters during World War II.",l:["<b>Compare with the MRT:</b> cost, cleanliness, crowding, signs and phone signal.","<b>The line map:</b> a design copied around the world.","<b>\"Mind the gap\":</b> listen out for it."]},
{n:"Churchill War Rooms",k:"Britain's wartime bunker",i:"These underground rooms went into use on 27 August 1939, days before the war began. Churchill and his War Cabinet ran the war from here.",l:["<b>Map Room:</b> left as it was when the lights went off in 1945.","<b>Transatlantic Telephone Room:</b> disguised as a tiny toilet, for secret calls with the US President.","<b>Cabinet War Room:</b> where the War Cabinet met.","<b>Churchill Museum:</b> his letters, belongings and recorded speeches. Which words still move you?","<b>Staff stories:</b> the people who worked and slept underground."]},
{n:"Sustainable Architecture walk",k:"Old city, green buildings",i:"London must fit new, low-carbon buildings around centuries of history. You will learn how building certification schemes such as BREEAM rate a building's environmental performance.",l:["<b>Reuse:</b> old walls kept around new interiors.","<b>Energy:</b> shading, natural ventilation and green roofs. Ask how each one saves power.","<b>History underneath:</b> London's Bloomberg office, for example, sits above a Roman temple.","<b>Compare:</b> how does this match Singapore's Green Mark and our garden-city planning?"]}],
10:[{n:"Poetry workshop",k:"With Jacob Sam-La Rose",i:"Jacob Sam-La Rose is a London poet, educator and editor, and the author of the collection <i>Breaking Silence</i>. He has run workshops at hundreds of schools and developed spoken word programmes with the Barbican.",l:["<b>Bring:</b> your writing material.","<b>Try this:</b> write about something you have seen on this trip.","<b>Listen for:</b> how a poem sounds aloud compared with on the page."]},
{n:"Old Chang Kee UK",k:"A Singapore brand in London",i:"The brand began in 1956 as a Hainanese curry puff stall in Singapore. It reached Covent Garden in 2018, its first site in Europe, through a joint venture with Singaporean Sandra Leong.",l:["<b>Testing first:</b> a Kentish Town pop-up sold out within four hours each day before the shop opened.","<b>Keeping the taste:</b> the curry paste was shipped to London, and staff were trained by a team from Old Chang Kee.","<b>The price:</b> a puff cost about £2.80 at launch, against S$1.50 in Singapore. Why?","<b>Ask:</b> what has been hardest about rent, staff and winning British customers?"]},
{n:"Covent Garden",k:"London's first modern square",i:"Inigo Jones laid out the piazza from 1630. Market stalls appeared in 1654 and grew into a major fruit and vegetable market, which moved away in 1974. The old market hall reopened as shops in 1980.",l:["<b>Street performers:</b> they audition for their slots.","<b>Punch and Judy:</b> Samuel Pepys recorded a show here in 1662, the first on record in Britain.","<b>Royal Opera House:</b> on the edge of the piazza."]},
{n:"British Museum",k:"Two million years of human history",i:"Founded by Act of Parliament in 1753, it opened in 1759. You have under two hours, so choose a few galleries. Some of its treasures are also the subject of today's debate over who should keep them.",l:["<b>Rosetta Stone:</b> the key to reading hieroglyphs. Egypt has asked for its return.","<b>Parthenon Sculptures:</b> removed by Lord Elgin. Greece formally asked for their return in 1983.","<b>Benin Bronzes:</b> looted by British forces in 1897. Nigeria has asked for their return.","<b>China and South Asia gallery:</b> see how China is presented here, compared with the Ashmolean.","<b>Great Court:</b> Norman Foster's glass roof, opened in 2000."]}],
11:[{n:"Natural History Museum",k:"A cathedral to nature",i:"Its grand Victorian building is an exhibit in its own right. Look at the carved animals on the walls as you enter.",l:["<b>Hope the blue whale:</b> 25.2 metres long, hanging in Hintze Hall in a diving pose. She was stranded in Ireland in 1891.","<b>Wonder Bays:</b> ten star specimens around Hintze Hall.","<b>Why \"Hope\"?</b> The name is a symbol of humanity's power to shape a sustainable future. Do you agree?"]},
{n:"Thames Barrier",k:"The gates that protect London",i:"The deadly North Sea flood of 1953 led to this barrier, opened in 1984. Its ten steel gates span 520 metres of the river. By July 2026, they had been closed 221 times to protect the city.",l:["<b>The gates:</b> hollow steel segments that rotate up from the riverbed.","<b>The future:</b> it is expected to work until about 2070. What happens as sea levels rise?","<b>Compare:</b> the Marina Barrage also holds a freshwater reservoir. What jobs does each barrier do?"]},
{n:"\"Hamilton\", Victoria Palace Theatre",k:"An American story on a British stage",i:"Lin-Manuel Miranda's Pulitzer Prize-winning musical retells the life of US founding father Alexander Hamilton through hip-hop, R&amp;B and traditional show tunes. It opened here in December 2017. Allow 2h 45min, including the interval.",l:["<b>King George III:</b> Britain's monarch is played for laughs. How does a London audience react?","<b>The cast:</b> who plays the founding fathers, and why does that matter?","<b>The rap battles:</b> political debate set to music.","<b>On the roof:</b> a gilt statue of ballerina Anna Pavlova."]}],
12:[{n:"Borough Market",k:"London's oldest food market",i:"Food has been traded by London Bridge since at least 1014. In 1756, local residents raised £6,000 to buy the site, and a charitable trust still runs the market today.",l:["<b>Your lunch:</b> walk the whole market once before you buy.","<b>British produce:</b> cheeses, pies and other foods you do not see in Singapore.","<b>Compare:</b> how is this different from a hawker centre?"]},
{n:"The Old Operating Theatre Museum",k:"Surgery before anaesthetic",i:"Hidden in the roof of a church, this is the oldest surviving operating theatre in the UK. It opened in 1822 for poor women patients at St Thomas' Hospital, closed in 1862, and was rediscovered in 1957.",l:["<b>The viewing stands:</b> medical students packed in to watch.","<b>The operating table:</b> imagine surgery with no anaesthetic and no antiseptic.","<b>Herb Garret:</b> where the hospital's apothecary stored and cured herbs.","<b>Be gentle:</b> some of what you see is graphic. Tell a teacher if you need a moment."]},
{n:"Musical Theatre Masterclass",k:"Hamilton, from the inside",i:"After last night's show, you get to try the craft yourself in a hands-on workshop based on Hamilton.",l:["<b>Performance:</b> what changes when you do it yourself?","<b>Music and choreography:</b> how do they tell the story without words?","<b>Dress:</b> be ready to move."]}],
13:[{n:"Westfield London",k:"Last-minute shopping and lunch",i:"Opened in 2008 at Shepherd's Bush, this huge shopping centre covers 1.6 million square feet. Use the time for your last lunch and any final souvenirs.",l:["<b>Luggage:</b> check your weight before you buy more.","<b>Food:</b> restaurants and Ichiba, a Japanese food hall.","<b>Time:</b> be back on time, as the High Commission is next."]},
{n:"Singapore High Commission",k:"Singapore's home in London",i:"The High Commission is at 9 Wilton Crescent, Belgravia, in a row of Grade II listed stucco buildings. Look for the Singapore coat of arms on the plaque outside.",l:["<b>Your questions:</b> bring the ones you posted for the Political Secretary.","<b>Listen for:</b> why the UK matters to Singapore, and what diplomats actually do each day.","<b>Dress and manners:</b> you are representing Hwa Chong and Singapore."]}]
};


const LEARNING={"People's History Museum": ["You will explore the history of democracy, workers' rights, social reform and the development of political participation in Britain. Through artefacts, stories and interactive exhibits, you will examine how ordinary citizens campaigned for voting rights, better working conditions and greater social equality.", "You will gain an appreciation of how political institutions and civic participation evolved, and see how the UK's democratic journey contrasts with or parallels Singapore's own political evolution post-independence."], "Salford Quays and MediaCityUK": ["You will investigate one of the UK's most successful urban regeneration projects, tracing the transformation of the former Manchester Docks from a declining industrial port into a thriving waterfront district centred on media, culture, technology and commerce. You will examine how strategic planning, investment, sustainability and adaptive reuse have revitalised the local economy while preserving historical heritage.", "You will explore how regeneration fosters economic growth, job creation and global investment. Compare these urban redevelopment strategies with Singapore's own redevelopment of areas such as Marina Bay and the Keppel-Tanjong Pagar terminals."], "Black Country Living Museum": ["You will see the Industrial Revolution's role in establishing Britain as a global economic power, and explore its far-reaching effects on trade, urbanisation and the British Empire.", "You will learn how coal mining, manufacturing and technological innovation fuelled Britain's industrial growth and transformed its society."], "Imperial War Museum North": ["You will investigate Britain's role in the Second World War through personal stories, historical artefacts and multimedia exhibits. The learning session lets you examine the impact of World War II on Britain, Europe and Asia, including the consequences for Singapore and the wider region. It also encourages you to discuss conflict, peacebuilding and Britain's continuing role in international affairs."], "Old Trafford": ["You will explore how one of the world's most recognised sports organisations combines elite performance, education, community outreach and commercial success. The stadium tour and museum show you how British football has evolved into a global industry that contributes significantly to the UK's economy, tourism and international influence.", "You will also examine how sport functions as a form of cultural diplomacy and strengthens Britain's global identity."], "Range Rover Factory, Solihull": ["You will gain first-hand insight into advanced manufacturing processes at one of the UK's leading automotive companies. You will observe how robotics, automation, artificial intelligence, precision engineering and quality control are integrated into modern vehicle production.", "The visit also introduces you to concepts such as sustainability, research and development, global supply chains and the importance of innovation in maintaining international competitiveness."], "Bletchley Park": ["You will explore the historic site where Allied codebreakers deciphered encrypted communications during the Second World War. Through interactive exhibits and a tailored learning session, you will discover how mathematics, cryptography, engineering and early computing contributed to intelligence gathering and helped shape the outcome of the war.", "You will learn about the pioneering work that laid the foundations for modern computer science and cybersecurity, while examining the ethical considerations surrounding intelligence and national security.", "The programme also encourages you to reflect on the importance of innovation, collaboration and problem-solving in addressing global challenges, and on how information and technology influence power, politics and global decision-making, both in the past and present."], "Oxford city walk": ["You will learn about Oxford's rich literary heritage, with connections to renowned authors such as J.R.R. Tolkien, C.S. Lewis, Lewis Carroll and Oscar Wilde, and see how the university and city have shaped English literature.", "The tour explains Oxford's distinctive collegiate education system and celebrates how Oxford has nurtured generations of influential leaders, writers, scientists and innovators."], "Ashmolean Museum": ["Through close examination of artefacts spanning over 3,000 years of Chinese civilisation, you will investigate the development of Chinese history, technology, philosophy and artistic traditions. The session also shows how British museums preserve, interpret and present world cultures, encouraging you to evaluate museums as centres for education, research and cross-cultural dialogue.", "You will develop historical inquiry skills by analysing primary sources and considering multiple perspectives on cultural heritage, collection practices and global interconnectedness. The experience also shows the UK's commitment to public education through its world-class museums."], "Magdalen College": ["Find out what you should consider when selecting a UK university for your undergraduate course of study. As you hear about your seniors' experiences with Oxford's collegiate system, consider the adaptations Singaporean students need to make in order to thrive in this environment."], "Browns Oxford": ["Find out what you should consider when selecting a UK university for your undergraduate course of study. As you hear about your seniors' experiences with Oxford's collegiate system, consider the adaptations Singaporean students need to make in order to thrive in this environment."], "Westminster Abbey": ["Through expert commentary, you will learn about the evolution of the monarchy, Parliament, religion and national identity, and how these institutions have influenced the development of governance, law and civic life in many Commonwealth countries, including Singapore."], "London City Tour": ["You will gain a broad introduction to London's historical and cultural landmarks while exploring how centuries of British history continue to shape modern Britain.", "Visits to iconic landmarks also give you opportunities to appreciate Britain's architectural heritage and how historic sites remain integral to contemporary society."], "UK Parliament": ["Through expert commentary, you will learn about the evolution of the monarchy, Parliament, religion and national identity, and how these institutions have influenced the development of governance, law and civic life in many Commonwealth countries, including Singapore."], "London Underground": ["The London Tube opened in 1863 and is the world's first underground railway. During WW2, London Underground stations also served as air raid shelters. Compare the cost, efficiency and commuter comfort of the public transport systems in London and Singapore."], "Churchill War Rooms": ["Follow up on your exploration of how WW2 influenced British culture and society, with enduring impacts on contemporary politics and economic development."], "Sustainable Architecture walk": ["Learn about the key principles behind sustainable building certification. Examine how London balances the preservation of historic landmarks with innovative architecture and sustainable city planning, gaining insights into Britain's commitment to environmental stewardship and liveable cities."], "Poetry workshop": ["A poet, educator and editor, Jacob's enthusiasm for using poetry as a tool for education and interaction has made him a renowned and inspirational figure in the poetry and educational communities."], "Old Chang Kee UK": ["Learn about the strategies used to expand into an overseas market."], "British Museum": ["Consider how the enormous collection of antiques from around the globe gives you insights into the UK's power and influence over the past few centuries.", "Discuss whether foreign nations with the means to conserve and study cultural treasures should be allowed to remove such artefacts from their original sites."], "Thames Barrier": ["Besides learning about the history of the barrier's development and construction, find out about the social, environmental and economic impacts of its use.", "Compare the functions of this structure with those of Singapore's Marina Barrage."], "\"Hamilton\", Victoria Palace Theatre": ["With an intentionally diverse cast bringing history to life using hip-hop, R&amp;B and rap music, alongside traditional musical theatre styles, watching \"Hamilton\" on the West End stage gives you a chance to think about how art and history connect, and how music and performance can make the past meaningful for us today."], "The Old Operating Theatre Museum": ["You will gain an appreciation of the role of hospitals, medical education and public health in improving quality of life. Compare Britain's medical advancements with the development of Singapore's healthcare system. The programme also develops your historical inquiry skills through the analysis of authentic artefacts, historical evidence and demonstrations of Victorian surgical practices."], "Musical Theatre Masterclass": ["Develop your appreciation of live theatre as an important aspect of Britain's cultural identity.", "You will explore how contemporary musical theatre reinterprets historical events for modern audiences. You will examine elements of performance, music, choreography and stagecraft, while analysing how the production blends traditional historical narratives with modern artistic forms."], "Singapore High Commission": ["Hear from the officials about Singapore's bilateral cooperation with the UK and why the UK is a valuable partner for Singapore, as well as the intricacies of maintaining cordial relations, and the experiences and challenges of Singaporeans living in the UK."]};

function ukDate(){try{return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/London",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}catch(e){return ""}}
function curDay(){const t=ukDate();return DAYS.find(d=>d.iso===t)}
function countdown(){
  const cur=curDay(); if(cur) return `<a class="badge hot" href="#day-${cur.n}">Today is Day ${cur.n}: open today's reflection</a>`;
  const ms=new Date("2026-11-06T23:00:00+08:00")-new Date(); const d=Math.ceil(ms/864e5);
  if(ms>0) return `<span class="badge hot">${d===1?"1 day":d+" days"} to go</span>`;
  return "";
}
function homeView(){
  return `<div class="hero"><div class="jack"></div>
   <div class="wrap hero-text"><div>
     <div class="eyebrow">Hwa Chong<span class="long"> Institution</span> · BSP</div>
     <h1>BSP UK <span>Immersion</span> 2026</h1>
     <p class="sub">Manchester · Oxford · London<span class="long"> · 14 days, 12 nights</span> · <span style="white-space:nowrap">7–20 Nov</span></p>
   </div>${unionJack}</div>
   <div class="wrap strip">${countdown()}<span class="badge" id="clocks">&nbsp;</span></div>
   ${scene}</div>
   <div class="wrap"><div class="tiles">${TILES.map((t,i)=>`<a class="tile ${t.cls}" style="--i:${i}" href="#${t.id}"><div><h2>${t.t.replace("&","&amp;")}</h2><p>${t.d}</p></div>${ART[t.id]}</a>`).join("")}</div></div>`;
}

  <div class="wrap"><div class="vbody">${inner}</div></div>`}

function daysView(){
  const cur=curDay();
  const tile=(d)=>`<a class="dtile${cur&&cur.n===d.n?" now":""}" style="--leg:${LEGS[d.leg].c}" href="#day-${d.n}"><span class="round">${d.n}</span><span><b>${d.date}${cur&&cur.n===d.n?" · Today":""}</b><span class="hl">${d.hl}</span><em>${d.g?"Reflection: "+GROUPS[d.g].short+"'s group":"Everyone reflects"}</em></span></a>`;
  const blk=(leg,list)=>`<div class="legblock" style="--leg:${LEGS[leg].c}"><div class="leghead"><i></i><h2>${LEGS[leg].t}</h2><small>${LEGS[leg].s}</small></div><div class="dgrid stag">${list.join("")}</div></div>`;
  const zero=`<a class="dtile" style="--leg:#6950a1" href="#day-0"><span class="round">0</span><span><b>Fri 6 Nov</b><span class="hl">Meet at Changi T3 Row 3, 11pm</span></span></a>`;
  const homeTiles=DAYS.filter(d=>d.leg==="home").map(tile);
  return shell("days",`<div class="how"><div><b>1. Discuss with your group</b>Share your key takeaways and discuss them as a group each day.</div><div><b>2. Post a short blog reflection</b>Post your daily reflection on our Google Site, using the day's focus.</div></div>
   <div class="legblock" style="--leg:#6950a1"><div class="leghead"><i></i><h2>Departure</h2></div><div class="dgrid">${zero}</div></div>
   ${["man","oxf","lon"].map(l=>blk(l,DAYS.filter(d=>d.leg===l).map(tile))).join("")}
   ${blk("home",homeTiles)}
   <p class="note">Timings may change because of traffic or other unforeseen situations. Follow your teachers' and Tour Manager's latest instructions.</p>`);
}
function trainLeft(n){return n===0?"0%":((n-.5)/14*100)+"%"}
function dayNav(n){return `<div class="tubeline"><div class="wrap"><div style="position:relative"><div class="train" id="train" style="left:${trainLeft(lastTrain)}">${trainSvg}</div><ol class="tl">${DAYS.map(d=>`<li style="--leg:${LEGS[d.leg].c}"${d.n===n?' class="cur"':""}><a href="#day-${d.n}" aria-label="Day ${d.n}, ${d.date}"${d.n===n?' aria-current="page"':""}><span class="st">${d.n}</span></a></li>`).join("")}</ol></div></div></div>`}
function dayTop(label,date,place,color,cur){return `<div class="topbar"><div class="wrap"><a class="home-btn" href="#home">← Home</a><a class="home-btn" style="background:#fff" href="#days">All days</a><span class="where">${date}</span></div></div><div class="daytop enter" style="--leg:${color}"><div class="wrap"><div class="big-round"><b>${label}</b></div><div style="min-width:0"><h1>${place}</h1><p>${date}${cur?" · Today":""}</p></div></div></div>`}
function dayView(n){
  if(n===0){return dayTop("DAY 0","Fri 6 Nov","Singapore","#6950a1")+dayNav(0)+`<div class="wrap"><div class="vbody day-b" style="--leg:#6950a1"><section class="pane plan tabpane on"><h2>Itinerary</h2><ul class="tt"><li><time>2300h</time><span class="dot"></span><span>Meet your Tour Manager at Terminal 3 Row 3 and check in for your flight<em>Wear a long-sleeved top, jeans or pants, and covered-toe shoes</em></span></li></ul></section><div class="pager"><a class="none" href="#days">x</a><a class="all" href="#days">All days</a><a href="#day-1">Day 1 →</a></div></div></div>`}
  const d=DAYS.find(x=>x.n===n); if(!d) return daysView();
  const g=d.g?GROUPS[d.g]:null; const cur=curDay();
  const meals=d.meals.replace(/<strong>(.*?)<\/strong>/,"<mark>$1</mark>");
  const pls=PLACES[n]||[], rows=PLACE_ROWS[n]||{};
  const tabs=[["plan","Itinerary"],["reflect","Reflection for the day"]];
  const about=(p,multi)=>`<details class="about"><summary><span>${multi?p.n:(ABOUT_LABEL[p.n]||"About this place")}</span></summary><div class="about-b"><b class="kick">${p.k}</b><p>${p.i}</p>${LEARNING[p.n]?`<div class="lv"><h4>Learning value</h4>${LEARNING[p.n].map(x=>`<p>${x}</p>`).join("")}</div>`:""}<h4>Look out for</h4><ul>${p.l.map(x=>`<li>${x}</li>`).join("")}</ul></div></details>`;
  const tab=tabs.some(t=>t[0]===dayTab)?dayTab:"plan";
  const on=k=>k===tab?" on":"";
  return dayTop("DAY "+d.n,d.date,d.place,LEGS[d.leg].c,cur&&cur.n===d.n)+dayNav(n)+`<div class="wrap"><div class="vbody day-b" style="--leg:${LEGS[d.leg].c}">
    <div class="daytabs" role="tablist">${tabs.map(t=>`<button role="tab" data-tab="${t[0]}" aria-selected="${t[0]===tab}">${t[1]}</button>`).join("")}</div>
    <div class="daypanes">
    <section class="pane plan tabpane${on("plan")}" data-pane="plan"><h2>Itinerary</h2><ul class="tt">${d.sched.map((s,i)=>{const r=rows[i]||[];return `<li><time>${s[0]||""}</time><span class="dot"></span><div class="stop-b">${s[1]}${s[2]?`<em>${s[2]}</em>`:""}${r.map(k=>about(pls[k],r.length>1)).join("")}</div></li>`}).join("")}</ul>
      <div class="meta"><span>${meals}</span>${d.stay?`<span><b>Tonight:</b> ${d.stay}</span>`:""}</div></section>
    <section class="pane reflect tabpane${on("reflect")}" data-pane="reflect"><div class="eyebrow">Reflection focus</div><p class="focus">${d.focus}</p>
      <ul class="prompts">${d.prompts.map((p,i)=>`<li style="--i:${i}"><span>${i+1}</span><span>${p}</span></li>`).join("")}</ul>
      <div class="tags">${d.klo.map(k=>`<a class="tag" href="#klo" data-k="${k}" title="${KLO[k-1].replace(/"/g,"&quot;")}">KLO ${k}</a>`).join("")}</div>
      <div class="steps">Discuss with your group, then post your short reflection on our Google Site.</div>
      <div class="grpline">${g?`<b>Reflection group:</b> ${g.teacher}'s group (${g.names.join(", ")})`:`<b>All groups:</b> whole-trip reflection`}</div></section>
    </div>
    <div class="pager"><a href="#day-${n-1}">← Day ${n-1}</a><a class="all" href="#days">All days</a>${n<14?`<a href="#day-${n+1}">Day ${n+1} →</a>`:`<a class="none" href="#days">x</a>`}</div></div></div>`;
}

function packView(){
  return shell("pack",`<div class="cols"><section class="card" style="--c:#35b8ee"><h2>Weather</h2><ul><li><mark>2–13°C</mark>, average 6–9°C. It could drop to 1°C.</li><li>Sunrise about 7.15am, sunset about 4.15pm.</li><li>Bring a foldable umbrella.</li></ul></section>
  <section class="card" style="--c:#dc241f"><h2>Baggage</h2><ul><li>1 check-in suitcase, 25kg limit. Keep it <mark>under 20kg when leaving Singapore</mark>. Lock it and label it.</li><li>1 carry-on backpack, under 7kg, plus a small crossbody bag.</li><li>Hand-carry liquids: containers up to 100ml, in one clear re-sealable bag of up to 1L. No sharp objects.</li><li>Power banks: hand-carry only, up to 2, each up to 100Wh (≤25,000mAh). Do not use them during the flight.</li></ul></section></div>
  <section class="card" style="--c:#6950a1"><h2>At least 3 layers</h2><div class="layers stag"><div style="--c:#c8102e"><b>Layer 1</b>Thermal innerwear</div><div style="--c:#012169"><b>Layer 2</b>Sweater or fleece</div><div style="--c:#00782a"><b>Layer 3</b>Hooded, waterproof jacket</div></div><p>A windbreaker is <mark>not sufficient</mark>. Wear comfortable, water-resistant covered shoes, preferably not new, with sports socks. Canvas shoes are not recommended.</p></section>
  <div class="packs">
   <section class="card" style="--c:#c8102e"><h2>Attire</h2><ul><li>1–2 jackets, hooded and waterproof (1 in hand-carry for arrival)</li><li>2–3 sweaters or fleece tops</li><li>4–5 long-sleeved tops</li><li>2–3 jeans or pants</li><li>2–3 sets of thermal innerwear</li><li>Sleepwear, undergarments, socks</li><li>Covered sneakers or boots</li><li>Slippers (optional, hotel room only)</li><li>Gloves, scarf, beanie</li></ul></section>
   <section class="card" style="--c:#35b8ee"><h2>Toiletries</h2><ul><li>Comb, toothbrush, toothpaste, shaver</li><li>Contact lenses, solution and case, spare glasses or lenses</li><li>Moisturiser, lip balm</li><li>Shampoo, shower gel, facial wash, deodorant</li><li>Tissue, wet wipes, hand sanitiser, laundry detergent</li></ul></section>
   <section class="card" style="--c:#ffd329"><h2>Documents & study</h2><ul><li>Passport, signed, with an approved UK ETA</li><li>YouTrip card with around £300 – £350, plus £50 in cash</li><li>Backpack and small crossbody bag</li><li>Writing material for the poetry workshop</li><li>Trip Workbook</li></ul></section>
   <section class="card" style="--c:#00782a"><h2>Others</h2><ul><li>Empty water bottle, to refill for the flight</li><li>Reusable bag; foldable umbrella or raincoat</li><li>Phone, charger, power bank</li><li>Multi-way plug (1 per room)</li><li>Zip lock bags for dirty clothes</li><li>Labelled medication for headache, fever, flu, diarrhoea, motion sickness. Teachers and Tour Managers cannot dispense medication.</li><li>Thermometer and at least 20 masks</li><li>Vitamin C, throat soothers, heat packs (recommended)</li></ul></section>
  </div>`);
}
function moneyView(){
  return shell("money",`<div class="cols">
   <section class="card" style="--c:#f5b700"><h2>Money</h2><p>£1 ≈ S$1.70. Bring <mark>£50 in cash</mark>, changed in Singapore, and load <mark>around £300 – £350 on YouTrip</mark>. Only polymer notes are accepted.</p><ul><li>8 lunches at £15 per meal: £120</li><li>3 days of Tube fare at £8.90 max per day: £27</li><li>Snacks and drinks: £5 per day</li><li>Souvenirs and shopping: £50 – £100</li></ul><p class="note">The lunch and Tube amounts have been offset from the overall package price (SGD 245).</p></section>
   <section class="card" style="--c:#35b8ee"><h2>Time, water, power</h2><ul><li>The UK is <mark>8 hours behind Singapore</mark>: 9am in the UK is 5pm in Singapore.</li><li>Best time to contact home: about 8am UK time, 4pm in Singapore. Parents are asked not to contact students during the day except in emergencies.</li><li>Tap water is potable. Pre-boiling is advised, and each room has a kettle. Bottled water is provided daily (2 × 500ml).</li><li>No travel adaptor needed. Bring one multi-way plug per room.</li></ul></section>
   <section class="card" style="--c:#c8102e"><h2>Passport & entry</h2><ul><li>Valid for at least 6 months from arrival, and signed. No visa needed for Singaporeans.</li><li><mark>You must have an approved UK ETA (Electronic Travel Authorisation) before you board.</mark> Without one, you will be denied boarding.</li><li>Apply on the official UK ETA app or at <a href="https://apply-for-an-eta.homeoffice.gov.uk">apply-for-an-eta.homeoffice.gov.uk</a>. It costs £20 per person. Avoid other websites, as some charge much more.</li><li>You need your passport and a photo of yourself. Most decisions come within minutes, but allow up to 3 working days.</li><li>The ETA is linked to your passport and lasts 2 years, or until the passport expires. If you get a new passport, you must apply again.</li><li>Not on a Singapore passport? Check the UK entry rules for your own passport.</li><li>Biometric passport holders can use the eGates.</li><li>Do not bring meat, dairy, fish or animal products, fruit, vegetables, nuts or seeds into Great Britain.</li></ul></section>
   <section class="card" style="--c:#6950a1"><h2>Phone & insurance</h2><ul><li>Check your roaming plan with your telco, or buy an eSIM before you go.</li><li>Travel insurance: Income Insurance, MOE Student Plan.</li><li><mark>Keep your boarding passes</mark>, as all claims need them.</li><li>Claims for loss need a police report within 24 hours. <a href="https://onlinetravelclaim.income.com.sg/travel-claim-web/travel">Claims website</a></li></ul></section>
  </div><p class="note"><a href="https://drive.google.com/file/d/1mdl35sj31-eoekAjcBvCTUH3qZe83q6O/view?usp=sharing">Open the Trip Booklet</a></p>`);
}

  <div class="cols"><section class="card" style="--c:#c8102e"><h2>Always be punctual</h2><p><mark>"On time is late."</mark> Observe all reporting times.</p></section>

/* ---- router ---- */
let lastTrain=1, clockTimer=null;
const RENDER={groups:groupsView,days:daysView,klo:kloView,flights:flightsView,pack:packView,money:moneyView,rules:rulesView,contacts:contactsView};
function tickClocks(){
  try{
    const now=new Date();
    const fmt=z=>new Intl.DateTimeFormat("en-GB",{timeZone:z,hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(now);
    const c=document.getElementById("clocks"); if(c) c.textContent=`London ${fmt("Europe/London")} · Singapore ${fmt("Asia/Singapore")}`;
    const [h,m]=fmt("Europe/London").split(":").map(Number);
    const H=document.getElementById("bbH"),M=document.getElementById("bbM");
    if(H&&M){H.style.transform=`rotate(${(h%12)*30+m/2}deg)`;M.style.transform=`rotate(${m*6}deg)`;}
  }catch(e){}
}
const saved={};let curRoute=null,seen={};
let dayTab="plan";try{dayTab=localStorage.getItem("bspDayTab")||"plan"}catch(e){}
function route(){
  const name=(location.hash||"#home").slice(1);
  if(curRoute==="home"||curRoute==="days")saved[curRoute]=window.scrollY;
  const dm=name.match(/^day-(\d+)$/);
  let html,key=name;
  if(dm&&+dm[1]<=14){html=dayView(+dm[1]);}
  else if(RENDER[name]){html=RENDER[name]();}
  else {html=homeView();key="home";}
  const revisit=!!seen[key]; seen[key]=1;
  document.body.classList.toggle("inner",key!=="home");
  app.classList.toggle("noanim",revisit&&(key==="home"||key==="days"));
  app.innerHTML=html;
  curRoute=key;
  window.scrollTo(0,saved[key]||0);
  if(dm&&+dm[1]<=14){const t=document.getElementById("train"),n=+dm[1];lastTrain=n;requestAnimationFrame(()=>requestAnimationFrame(()=>{if(t)t.style.left=trainLeft(n)}));}
  if(pendingK){const el=document.getElementById("k"+pendingK);pendingK=null;if(el){el.classList.add("flash");el.scrollIntoView({block:"center"});}}
  tickClocks();
}
/* day tabs on phones */
document.addEventListener("click",e=>{
  const b=e.target.closest&&e.target.closest(".daytabs button");if(!b)return;
  dayTab=b.dataset.tab;try{localStorage.setItem("bspDayTab",dayTab)}catch(err){}
  document.querySelectorAll(".daytabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  document.querySelectorAll("[data-pane]").forEach(p=>p.classList.toggle("on",p.dataset.pane===dayTab));
  const bar=document.querySelector(".daytabs");
  if(bar){const y=bar.parentElement.getBoundingClientRect().top+window.scrollY-54;if(window.scrollY>y)window.scrollTo(0,y);}
});
/* swipe between days */
let sx=0,sy=0,sOk=false;
document.addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;sOk=t.clientX>24&&t.clientX<window.innerWidth-24;},{passive:true});
document.addEventListener("touchend",e=>{
  if(!sOk)return;const m=(location.hash||"").match(/^#day-(\d+)$/);if(!m)return;
  const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<70||Math.abs(dy)>45)return;
  const n=+m[1]+(dx<0?1:-1);if(n>=0&&n<=14)location.hash="#day-"+n;
},{passive:true});
let pendingK=null;
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a[href^='#']");if(!a)return;if(a.dataset.k)pendingK=a.dataset.k;const h=a.getAttribute("href");if(h===(location.hash||"#home")){e.preventDefault();route();}});
window.addEventListener("hashchange",route);
clockTimer=setInterval(tickClocks,20000);
route();
</script>
